[package]
name = "siftx"
version = "0.1.0"
edition = "2024"

[dependencies]
fs4 = "1.1.0"
fst = "0.4.7"
ratatui = "0.30.0"
color-eyre = "0.6.5"
crossterm = "0.29.0"
thiserror = "2.0.18"
bumpalo = { version = "3.20.3", features = ["collections"] }
csv = "1.4.0"
lopdf = "0.41.0"
wincode = {version =  "0.5.5", features = ["default", "uuid", "derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version =  "1.23.4", features = ["default", "serde", "v4"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "postings"
harness = false
